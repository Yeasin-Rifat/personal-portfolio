<div class="container py-5">

  <h1 class="mb-5 text-center">
    My Projects
  </h1>

  <div class="row">

    <div
      class="col-md-4 mb-4"
      *ngFor="let project of projects"
    >

      <div class="card h-100">

        <img
          [src]="project.imageUrl"
          class="card-img-top"
          height="220"
        >

        <div class="card-body">

          <h5 class="card-title">
            {{ project.title }}
          </h5>

          <p class="card-text">
            {{ project.description }}
          </p>

          <p>
            <strong>
              Tech:
            </strong>

            {{ project.techStack }}
          </p>

        </div>

        <div class="card-footer">

          <a
            [href]="project.githubLink"
            target="_blank"
            class="btn btn-dark me-2"
          >
            Github
          </a>

          <a
            [href]="project.liveLink"
            target="_blank"
            class="btn btn-primary"
          >
            Live
          </a>

        </div>

      </div>

    </div>

  </div>

</div>
