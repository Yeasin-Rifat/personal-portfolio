<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card p-5">

        <h2 class="text-center text-dark mb-4">

          Admin Login

        </h2>

        <div class="mb-3">

          <label class="form-label text-dark">

            Email

          </label>

          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
          >

        </div>

        <div class="mb-3">

          <label class="form-label text-dark">

            Password

          </label>

          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
          >

        </div>

        <div
          *ngIf="errorMessage"
          class="alert alert-danger"
        >

          {{ errorMessage }}

        </div>

        <button
          class="btn btn-dark w-100"
          (click)="login()"
        >

          Login

        </button>

      </div>

    </div>

  </div>

</div>
