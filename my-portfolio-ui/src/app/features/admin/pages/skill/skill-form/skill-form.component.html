<div class="container py-5">

  <div class="card p-5">

    <h2 class="mb-4 text-dark">

      {{
        isEditMode
          ? 'Edit Skill'
          : 'Create Skill'
      }}

    </h2>

    <!-- Name -->

    <div class="mb-3">

      <label class="form-label">

        Skill Name

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="skill.name"
      >

    </div>

    <!-- Percentage -->

    <div class="mb-3">

      <label class="form-label">

        Percentage

      </label>

      <input
        type="number"
        class="form-control"
        [(ngModel)]="skill.percentage"
      >

    </div>

    <!-- Category -->

    <div class="mb-4">

      <label class="form-label">

        Category

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="skill.category"
      >

    </div>

    <!-- Save -->

    <button
      class="btn btn-dark"
      (click)="saveSkill()"
      [disabled]="isSaving"
    >

      {{
        isSaving
          ? 'Saving...'
          : 'Save Skill'
      }}

    </button>

  </div>

</div>
