<div class="container py-5">

  <div
    class="d-flex justify-content-between mb-4"
  >

    <h2 class="text-dark">

      Manage Experience

    </h2>

    <a
      routerLink="/admin/experience/create"
      class="btn btn-dark"
    >

      Add Experience

    </a>

  </div>

  <div class="card p-4 text-dark">

    <table class="table">

      <thead>

      <tr>

        <th>Company</th>

        <th>Position</th>

        <th>Duration</th>

        <th>Actions</th>

      </tr>

      </thead>

      <tbody>

      <tr
        *ngFor="
          let experience of experiences
        "
      >

        <td>

          {{ experience.companyName }}

        </td>

        <td>

          {{ experience.position }}

        </td>

        <td>

          {{ experience.startDate }}

          -

          <span
            *ngIf="
              experience.currentlyWorking
            "
          >

            Present

          </span>

          <span
            *ngIf="
              !experience.currentlyWorking
            "
          >

            {{ experience.endDate }}

          </span>

        </td>

        <td>

          <button
            class="btn btn-primary btn-sm me-2"
            (click)="editExperience(experience.id!)"
          >

            Edit

          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteExperience(experience.id!)"
          >

            Delete

          </button>

        </td>

      </tr>

      <tr
        *ngIf="
          experiences.length === 0
        "
      >

        <td
          colspan="4"
          class="text-center"
        >

          No experience found

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>
