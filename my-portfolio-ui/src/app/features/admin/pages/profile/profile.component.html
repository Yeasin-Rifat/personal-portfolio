<div class="container py-5">

  <div class="card p-5">

    <h2 class="mb-4 text-dark">

      Manage Profile

    </h2>

    <!-- Full Name -->

    <div class="mb-3">

      <label class="form-label">

        Full Name

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.fullName"
      >

    </div>

    <!-- Title -->

    <div class="mb-3">

      <label class="form-label">

        Title

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.title"
      >

    </div>

    <!-- Bio -->

    <div class="mb-3">

      <label class="form-label">

        Bio

      </label>

      <textarea
        rows="5"
        class="form-control"
        [(ngModel)]="profile.bio"
      ></textarea>

    </div>

    <!-- Profile Image -->

    <div class="mb-3">

      <label class="form-label">

        Profile Image

      </label>

      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
      >

      <div
        *ngIf="profile.profileImage"
        class="mt-3"
      >

        <img
          [src]="profile.profileImage"
          class="img-thumbnail"
          width="200"
        >

      </div>

    </div>

    <!-- Resume URL -->

    <div class="mb-3">

      <label class="form-label">

        Resume URL

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.resumeUrl"
      >

    </div>

    <!-- Github -->

    <div class="mb-3">

      <label class="form-label">

        Github Link

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.githubLink"
      >

    </div>

    <!-- LinkedIn -->

    <div class="mb-3">

      <label class="form-label">

        LinkedIn Link

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.linkedinLink"
      >

    </div>

    <!-- Facebook -->

    <div class="mb-3">

      <label class="form-label">

        Facebook Link

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.facebookLink"
      >

    </div>

    <!-- Email -->

    <div class="mb-3">

      <label class="form-label">

        Email

      </label>

      <input
        type="email"
        class="form-control"
        [(ngModel)]="profile.email"
      >

    </div>

    <!-- Phone -->

    <div class="mb-3">

      <label class="form-label">

        Phone

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.phone"
      >

    </div>

    <!-- Location -->

    <div class="mb-4">

      <label class="form-label">

        Location

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="profile.location"
      >

    </div>

    <!-- Save -->

    <button
      class="btn btn-dark"
      (click)="saveProfile()"
      [disabled]="isSaving"
    >

      {{
        isSaving
          ? 'Saving...'
          : 'Save Profile'
      }}

    </button>

  </div>

</div>
