<div class="container py-5">

  <div class="card p-5">

    <h2 class="mb-4">

      {{
        isEditMode
          ? 'Edit Project'
          : 'Create Project'
      }}

    </h2>

    <div class="mb-3">

      <label class="form-label">

        Title

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="project.title"
      >

    </div>

    <div class="mb-3">

      <label class="form-label">

        Description

      </label>

      <textarea
        rows="5"
        class="form-control"
        [(ngModel)]="project.description"
      ></textarea>

    </div>

    <div class="mb-3">

      <label class="form-label">

        Image URL

      </label>

      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
      >

      <div
        *ngIf="project.imageUrl"
        class="mt-3"
      >

        <img
          [src]="project.imageUrl"
          class="img-fluid rounded"
          width="300"
        >

      </div>

    </div>

    <div class="mb-3">

      <label class="form-label">

        Github Link

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="project.githubLink"
      >

    </div>

    <div class="mb-3">

      <label class="form-label">

        Live Link

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="project.liveLink"
      >

    </div>

    <div class="mb-3">

      <label class="form-label">

        Tech Stack

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="project.techStack"
      >

    </div>

    <div class="form-check mb-4">

      <input
        type="checkbox"
        class="form-check-input"
        [(ngModel)]="project.featured"
      >

      <label class="form-check-label">

        Featured Project

      </label>

    </div>

    <button
      class="btn btn-dark"
      (click)="saveProject()"
    >

      Save Project

    </button>

  </div>

</div>
